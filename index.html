<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glide MotionFrames</title>
    <meta name="description" content="Glide MotionFrames は、映像編集を専門とするフリーランスクリエイターが運営するポストプロダクションサービスです。" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script> 
    <link rel="icon" href="/favicon.ico?v=2" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #030303;
            color: #fff;
            text-align: center;
            overflow-x: hidden;
        }

        /* ----- 背景動画 ----- */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }
        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%) contrast(1.1);
        }
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
        }

        /* ----- 中央ロゴアニメーション（これだけは黒背景動画なのでmix-blend-mode維持） ----- */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .hero-content {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            mix-blend-mode: screen; 
        }
        .hero-logo-video {
            width: 100%;
            max-width: 1000px;
            pointer-events: none;
        }

        /* ----- ヘッダー（上のロゴ） ----- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .header img {
            height: 38px; /* 透過ロゴをスッキリ見せるサイズ */
            /* 透過PNGなのでmix-blend-modeは削除 */
        }

        .about-section {
            padding: 100px 5%;
            background: linear-gradient(to bottom, transparent, #0a0a0a);
        }
        .director-note {
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
            line-height: 1.8;
            font-size: 0.95rem;
            color: #bbb;
            border-left: 1px solid #555;
            padding-left: 20px;
        }

        .works {
            padding: 80px 5%;
            background: #0a0a0a;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }
        .works h2 {
            grid-column: 1 / -1;
            margin-bottom: 20px;
            color: #fff;
            letter-spacing: 2px;
        }
        .work-item {
            position: relative;
            overflow: hidden;
            background: #000;
        }
        .work-item img {
            width: 100%;
            display: block;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.3s;
            border-radius: 2px;
            filter: brightness(0.7);
        }
        
        .work-item:hover img {
            transform: scale(1.03);
            filter: brightness(1.2) contrast(1.5) saturate(1.2);
            box-shadow: inset 0 0 50px rgba(255, 0, 0, 0.3);
        }

        /* ----- フッター（連絡先） ----- */
        .contact {
            padding: 80px 5%;
            background: #050505;
        }
        .footer-logo {
            width: 110px; /* 下の透過ロゴサイズ */
            margin-bottom: 30px;
            opacity: 0.7;
            /* 透過PNGなのでmix-blend-modeは削除 */
        }
        .contact h2 {
            margin-bottom: 20px;
        }
        .contact-info {
            font-size: 1em;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }
        .contact-info a {
            color: #aaa;
            text-decoration: none;
            font-size: 1.1em;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .contact-info a:hover {
            color: #fff;
        }

        .social-icons {
            display: flex;            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .social-icons a {
            font-size: 1.5em;
            color: #888;
            transition: transform 0.3s ease, color 0.3s ease;
        }
        .social-icons a:hover {
            transform: scale(1.1);
            color: #fff;
        }

        .hidden {
            opacity: 0;
            transform: translateY(30px);
        }
    </style>
</head>
<body>

    <div class="video-background">
        <video autoplay loop muted playsinline>
            <source src="integrate.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <header class="header">
        <img src="logo-v2.png" alt="Glide MotionFrames">
    </header>

    <section class="hero">
        <div class="hero-content">
            <video autoplay muted playsinline class="hero-logo-video">
                <source src="GMF_WhiteFull.mp4" type="video/mp4">
            </video>
        </div>
    </section>

    <section class="about-section">
        <div class="director-note hidden">
            <p><strong>Director's Note</strong><br><br>
            日常の中に潜む「違和感」と、マクロな視点から生まれる「質感」。<br>
            視覚と聴覚から生理的な感覚に直接介入し、美しさと恐怖が混在するシネマティックな体験を設計する。</p>
        </div>
    </section>

    <section class="works container">
        <h2 data-aos="fade-up">Works</h2>
        
        <div class="work-item hidden">
            <img src="https://source.unsplash.com/600x400/?dark,room,red" alt="The X">
        </div>
        <div class="work-item hidden">
            <img src="https://source.unsplash.com/600x400/?noise,static,horror" alt="適合">
        </div>
        <div class="work-item hidden">
            <img src="https://source.unsplash.com/600x400/?water,macro,abstract" alt="明日、私は世界になる">
        </div>
    </section>

    <section class="contact">
        <img src="logo-v2.png" alt="Glide MotionFrames" class="footer-logo">
        <h2 data-aos="fade-up">Contact</h2>
        <div class="social-icons">
            <a href="https://www.instagram.com/glide_motionframes" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://x.com/gmotionframes" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://www.tiktok.com/@vortexflameworks.com" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
        </div>
        <div class="contact-info">
            <a href="mailto:contact@glidemotionframes.com">
                <i class="fa-solid fa-envelope"></i> contact@glidemotionframes.com
            </a>
        </div>
    </section>

    <script>
        AOS.init();
        gsap.utils.toArray('.hidden').forEach((element) => {
            gsap.to(element, { opacity: 1, y: 0, duration: 1.2, ease: "power2.out", scrollTrigger: { trigger: element, start: "top 85%" } });
        });
    </script>
</body>
</html>
