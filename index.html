<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glide MotionFrames</title>
    <meta name="description" content="Glide MotionFrames は、映像編集を専門とするフリーランスクリエイターが運営するポストプロダクションサービスです。" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script> 
    <link rel="icon" href="/favicon.ico?v=2" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Montserrat', 'Noto Sans JP', sans-serif;
            background-color: #030303;
            color: #fff;
            text-align: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ----- 背景動画 ----- */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }
        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%) contrast(1.1);
        }
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
        }

        /* ----- 中央ロゴアニメーション ----- */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero-content {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            mix-blend-mode: screen; 
        }
        .hero-logo-video {
            width: 100%;
            max-width: 1000px;
            pointer-events: none;
        }

        /* ----- ヘッダー ----- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .header img {
            height: 38px;
            display: block;
        }

        /* ----- セクション見出し（歪み修正済み） ----- */
        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            text-indent: 0.4em; /* 字間分を左に押し戻して完全中央へ */
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: #fff;
            display: block;
            width: 100%;
        }

        /* ----- ディレクターズノート ----- */
        .about-section {
            padding: 120px 5%;
            background: linear-gradient(to bottom, transparent, #0a0a0a 20%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .director-note {
            max-width: 700px;
            text-align: left;
            line-height: 2.2;
            font-size: 0.9rem;
            color: #aaa;
            border-left: 1px solid #333;
            padding-left: 30px;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        /* ----- 作品一覧 ----- */
        .works {
            padding: 100px 5%;
            background: #0a0a0a;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            justify-items: center;
        }
        .works h2 {
            grid-column: 1 / -1;
        }
        .work-item {
            position: relative;
            overflow: hidden;
            background: #000;
            width: 100%;
            aspect-ratio: 16 / 9;
        }
        .work-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), filter 0.5s;
            filter: brightness(0.6) grayscale(30%);
        }
        .work-item:hover img {
            transform: scale(1.05);
            filter: brightness(1.1) grayscale(0%);
        }

        /* ----- フッター（歪み修正済み） ----- */
        .contact {
            padding: 120px 5%;
            background: #050505;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .footer-logo {
            width: 110px;
            margin-bottom: 40px;
            opacity: 0.5;
            display: block;
        }
        .contact-info {
            margin-top: 30px;
            width: 100%;
        }
        .contact-info a {
            font-family: 'Montserrat', sans-serif;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-indent: 0.1em; /* ここも字間分を補正 */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.3s;
        }
        .contact-info a:hover {
            color: #fff;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            width: 100%;
        }
        .social-icons a {
            font-size: 1.4em;
            color: #555;
            transition: 0.4s ease;
        }
        .social-icons a:hover {
            color: #fff;
            transform: translateY(-5px);
        }

        .hidden {
            opacity: 0;
            transform: translateY(20px);
        }
    </style>
</head>
<body>

    <div class="video-background">
        <video autoplay loop muted playsinline>
            <source src="integrate.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <header class="header">
        <img src="logo-v2.png" alt="Glide MotionFrames">
    </header>

    <section class="hero">
        <div class="hero-content">
            <video autoplay muted playsinline class="hero-logo-video">
                <source src="GMF_WhiteFull.mp4" type="video/mp4">
            </video>
        </div>
    </section>

    <section class="about-section">
        <h2 data-aos="fade-up">Director's Note</h2>
        <div class="director-note hidden">
            <p>日常の中に潜む「違和感」と、マクロな視点から生まれる「質感」。<br>
            視覚と聴覚から生理的な感覚に直接介入し、美しさと恐怖が混在するシネマティックな体験を設計する。</p>
        </div>
    </section>

    <section class="works container">
        <h2 data-aos="fade-up">Works</h2>
        <div class="work-item hidden">
            <img src="https://source.unsplash.com/600x400/?dark,room,red" alt="The X">
        </div>
        <div class="work-item hidden">
            <img src="https://source.unsplash.com/600x400/?noise,static,horror" alt="適合">
        </div>
        <div class="work-item hidden">
            <img src="https://source.unsplash.com/600x400/?water,macro,abstract" alt="明日、私は世界になる">
        </div>
    </section>

    <section class="contact">
        <img src="logo-v2.png" alt="Glide MotionFrames" class="footer-logo">
        <h2 data-aos="fade-up">Contact</h2>
        <div class="social-icons">
            <a href="https://www.instagram.com/glide_motionframes" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://x.com/gmotionframes" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://www.tiktok.com/@vortexflameworks.com" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
        </div>
        <div class="contact-info">
            <a href="mailto:contact@glidemotionframes.com">
                <i class="fa-solid fa-envelope"></i> contact@glidemotionframes.com
            </a>
        </div>
    </section>

    <script>
        AOS.init({ duration: 1000, once: true });
        gsap.utils.toArray('.hidden').forEach((element) => {
            gsap.to(element, { opacity: 1, y: 0, duration: 1.5, ease: "power3.out", scrollTrigger: { trigger: element, start: "top 90%" } });
        });
    </script>
</body>
</html>
